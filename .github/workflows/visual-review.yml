name: Visual Review

on:
  push:
    branches:
      - ux-review-2026-10-01
  workflow_dispatch:

jobs:
  build-compatibility:
    name: Build on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run host-compatible production build
        run: npm run build

  screenshot:
    needs: build-compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build exact site output
        run: npm run build
      - name: Capture exact desktop previews
        run: |
          python3 -m http.server 4173 -d dist >/tmp/verde-http.log 2>&1 &
          sleep 2
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=2048,900 --screenshot=homepage.png http://127.0.0.1:4173/
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=2048,900 --screenshot=contact.png http://127.0.0.1:4173/contact/
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=2048,1800 --screenshot=about.png http://127.0.0.1:4173/about/
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=2048,1400 --screenshot=bare-ranch.png http://127.0.0.1:4173/case-studies/bare-ranch/
      - name: Upload exact previews
        uses: actions/upload-artifact@v4
        with:
          name: verde-exact-previews
          path: |
            homepage.png
            contact.png
            about.png
            bare-ranch.png
